name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check alignmenter scripts/release_smoke.py
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e 'alignmenter[test]'
      - run: pytest alignmenter/tests --cov=alignmenter --cov-report=term-missing
  calibration-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e 'alignmenter[test,calibrate]'
      - run: pytest alignmenter/tests
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build alignmenter --outdir dist
      - run: twine check dist/*
      - name: Rehearse lightweight wheel and source installations
        run: |
          python -m venv .release-venv
          .release-venv/bin/pip install dist/*.whl
          .release-venv/bin/pip check
          .release-venv/bin/python scripts/release_smoke.py --core-only --out reports/wheel
          python -m venv .source-venv
          .source-venv/bin/pip install dist/*.tar.gz
          .source-venv/bin/pip check
          .source-venv/bin/python scripts/release_smoke.py --core-only --out reports/source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-rehearsal
          path: |
            dist/*
            reports/**/rehearsal.json
            reports/**/review/*
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e 'alignmenter[docs]'
      - run: mkdocs build --strict
  marketing-build:
    runs-on: ubuntu-latest
    env:
      MARKETING_BUCKET: ${{ secrets.MARKETING_BUCKET }}
      CLOUDFRONT_DISTRO: ${{ secrets.CLOUDFRONT_DISTRO }}
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Configure AWS credentials
        if: ${{ github.event_name == 'push' && github.repository == 'justinGrosvenor/alignmenter' && env.MARKETING_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Sync static site to S3
        if: ${{ github.event_name == 'push' && github.repository == 'justinGrosvenor/alignmenter' && env.MARKETING_BUCKET != '' }}
        run: |
          BUCKET=${MARKETING_BUCKET#s3://}
          BUCKET=${BUCKET%/}
          BUCKET=$(printf '%s' "$BUCKET" | tr -d '[:space:]')
          test -n "$BUCKET"
          aws s3 sync ./out "s3://$BUCKET" --delete
      - name: Invalidate CloudFront cache
        if: ${{ github.event_name == 'push' && github.repository == 'justinGrosvenor/alignmenter' && env.MARKETING_BUCKET != '' && env.CLOUDFRONT_DISTRO != '' }}
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRO" --paths '/*'
