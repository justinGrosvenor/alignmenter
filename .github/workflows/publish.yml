name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e 'alignmenter[test]'
      - name: Verify release identity
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          from alignmenter import __version__
          assert __version__ == version('alignmenter')
          assert os.environ['GITHUB_REF_NAME'] == f'v{__version__}'
          PY
      - run: ruff check alignmenter scripts/release_smoke.py
      - run: pytest alignmenter/tests
      - run: python -m build alignmenter --outdir dist
      - run: twine check dist/*
      - name: Verify installed release artifacts
        run: |
          python -m venv .release-venv
          .release-venv/bin/pip install dist/*.whl
          .release-venv/bin/pip check
          .release-venv/bin/python scripts/release_smoke.py --core-only --out reports/wheel
          python -m venv .source-venv
          .source-venv/bin/pip install dist/*.tar.gz
          .source-venv/bin/pip check
          .source-venv/bin/python scripts/release_smoke.py --core-only --out reports/source
      - uses: actions/upload-artifact@v4
        with:
          name: published-distributions
          path: dist/*
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
