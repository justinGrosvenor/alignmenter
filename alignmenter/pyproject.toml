[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alignmenter"
dynamic = ["version"]
description = "Durable application alignment evaluations, evidence review, saved comparisons, and CI gates."
authors = [{name = "Alignmenter"}]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["llm", "evaluation", "alignment", "persona", "safety", "llm-judge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# Core install is lightweight: no torch, no scikit-learn. The default scoring
# path (hashed embeddings + LLM judge + keyword safety) runs on these alone.
# Heavy local-model dependencies live in the optional [ml] and [calibrate] extras.
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2,<3",
  "openai>=1.40,<3",
  "anthropic>=0.40,<1",
  "pyyaml>=6,<7",
  "tiktoken>=0.7,<1",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
# Local embeddings (sentence-transformers) + offline safety classifier (transformers).
# This is the only extra that pulls in torch.
ml = [
  "torch>=2,<3",
  "sentence-transformers>=3,<6",
  "transformers>=4.40,<6",
]
# Persona calibration / trait-model training and diagnostics.
calibrate = [
  "scikit-learn>=1.3,<2",
  "numpy>=1.24,<3",
]
# Back-compat alias: the offline safety classifier ships in [ml].
safety = ["alignmenter[ml]"]
# Everything runtime-optional in one shot.
all = ["alignmenter[ml,calibrate]"]
dev = [
  "alignmenter[ml,calibrate]",
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.6",
  "build",
  "twine",
]
test = ["pytest>=8", "pytest-cov", "ruff>=0.6", "build", "twine"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9,<10"]

[project.urls]
Homepage = "https://alignmenter.com"
Repository = "https://github.com/justinGrosvenor/alignmenter"
Documentation = "https://github.com/justinGrosvenor/alignmenter"
"Bug Tracker" = "https://github.com/justinGrosvenor/alignmenter/issues"

[project.scripts]
alignmenter = "alignmenter.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "alignmenter._version.__version__"}

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alignmenter = [
  "data/configs/**/*.yaml",
  "data/configs/**/*.txt",
  "data/datasets/*.jsonl",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Typer Exit/BadParameter are control-flow re-raises; chaining a traceback adds noise.
"src/alignmenter/cli.py" = ["B904"]
"src/alignmenter/scripts/run_openai_demo.py" = ["B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error::DeprecationWarning:alignmenter.*",
]
